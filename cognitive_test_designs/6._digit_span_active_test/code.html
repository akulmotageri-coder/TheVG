<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Digit Span - Active Test</title>
<!-- Tailwind CSS CDN with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              burgundy: '#9E2A47',
              burgundyHover: '#86223B',
              softRose: '#FDF2F4',
              teal: '#40B2B7',
              charcoal: '#1A1C1E',
              muted: '#71767B',
              bgLight: '#F7F7F6',
              keyBg: '#FFFFFF',
              keyBorder: '#E5E7EB',
              inputBg: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            key: '0 2px 4px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02)',
            card: '0 4px 16px -2px rgba(0, 0, 0, 0.05)',
            glow: '0 4px 14px 0 rgba(158, 42, 71, 0.25)'
          }
        }
      }
    }
  </script>
<style data-purpose="base-typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
      background-color: #ECECEC;
    }
  </style>
<style data-purpose="keypad-interactions">
    /* Subtle press feedback simulation */
    .key-btn {
      transition: transform 0.08s ease, background-color 0.1s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .key-btn:active {
      transform: scale(0.94);
    }
    /* Pulsing input cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1.1s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-brand-charcoal">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[390px] h-[844px] bg-[#F7F7F6] sm:rounded-[44px] sm:shadow-2xl overflow-hidden flex flex-col justify-between relative border border-[#ECECEE]">
<!-- BEGIN: TopBarAndProgress -->
<header class="pt-3 px-5">
<!-- iOS Status Notch & Icons Placeholder -->
<div class="h-6 flex justify-between items-center text-xs font-semibold text-brand-charcoal px-1 mb-1">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.2.2-.2.51 0 .71.1.1.23.15.35.15s.26-.05.35-.15l1.64-1.64C8.25 18.39 10.04 19 12 19c4.97 0 9-4.03 9-9s-4.03-9-9-9z" fill="none"></path>
<path d="M2 17h3v4H2v-4zm6-5h3v9H8v-9zm6-5h3v14h-3V7zm6-5h3v19h-3V2z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.2c3.81 0 7.28 1.49 9.87 3.93L12 19.04 2.13 11.13C4.72 8.69 8.19 7.2 12 7.2z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-brand-charcoal rounded-sm p-0.5 flex items-center">
<div class="h-full w-3 bg-brand-charcoal rounded-2xs"></div>
</div>
</div>
</div>
<!-- Navigation Header -->
<nav aria-label="Test header" class="flex items-center justify-between py-2 relative">
<!-- Back Button -->
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-black/5 active:scale-95 transition-all text-brand-charcoal" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15 18l-6-6 6-6"></path>
</svg>
</button>
<!-- Active Test Pill Tag -->
<div class="flex items-center gap-1.5 px-3 py-1 bg-white border border-gray-100 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-brand-teal"></span>
<span class="text-xs font-semibold text-gray-700 tracking-tight">Active Test</span>
</div>
<!-- Spacer to balance layout -->
<div class="w-9"></div>
</nav>
<!-- Horizontal Progress Bar (Step Indicator) -->
<div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden mt-2">
<div class="bg-brand-burgundy h-full w-2/5 rounded-full transition-all duration-300"></div>
</div>
<!-- Sub-header Row: Round Indicator and Mode Badge -->
<div class="flex items-center justify-between mt-3 px-0.5">
<span class="text-xs font-medium text-gray-500 tracking-wide">Round 1 of 3</span>
<span class="text-[11px] font-semibold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200/60">
          Recall
        </span>
</div>
</header>
<!-- END: TopBarAndProgress -->
<!-- BEGIN: TestInteractionArea -->
<section class="flex-1 flex flex-col justify-start px-6 pt-5" data-purpose="sequence-input-section">
<!-- Main Instruction Heading -->
<h1 class="text-2xl font-bold text-center text-[#1F2429] tracking-tight mb-6">
        Enter the sequence
      </h1>
<!-- Input Field Display Card -->
<div class="w-full bg-white rounded-2xl border border-gray-200/80 shadow-sm py-5 px-6 flex items-center justify-center min-h-[76px] relative" data-purpose="entered-sequence-display">
<!-- Digits sequence with active blinking cursor -->
<div class="flex items-center justify-center space-x-3 text-2xl font-bold tracking-widest text-[#1F2429]">
<span class="tracking-widest min-w-[8px]" id="display-value"></span>
<span class="h-6 w-0.5 bg-brand-burgundy rounded-full cursor-blink"></span>
</div>
</div>
<!-- Secondary Subtitle/Prompt Note -->
<p class="text-center text-xs text-gray-400 font-medium mt-3">
        Type the numbers in the order they appeared
      </p>
</section>
<!-- END: TestInteractionArea -->
<!-- BEGIN: NumericKeypad -->
<section class="px-7 pb-8 pt-2" data-purpose="numeric-keypad">
<div class="grid grid-cols-3 gap-3.5 max-w-[320px] mx-auto">
<!-- Row 1 -->
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="1" type="button">
          1
        </button>
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="2" type="button">
          2
        </button>
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="3" type="button">
          3
        </button>
<!-- Row 2 -->
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="4" type="button">
          4
        </button>
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="5" type="button">
          5
        </button>
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="6" type="button">
          6
        </button>
<!-- Row 3 -->
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="7" type="button">
          7
        </button>
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="8" type="button">
          8
        </button>
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="9" type="button">
          9
        </button>
<!-- Row 4: Backspace, 0, Submit Action -->
<!-- Delete / Backspace Key -->
<button aria-label="Backspace" class="key-btn h-14 rounded-2xl bg-[#F0EFF2] border border-gray-200/80 text-gray-700 shadow-key flex items-center justify-center hover:bg-[#E8E6EB]" id="btn-backspace" type="button">
<svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"></path>
<line x1="18" x2="12" y1="9" y2="15"></line>
<line x1="12" x2="18" y1="9" y2="15"></line>
</svg>
</button>
<!-- Zero Key -->
<button class="key-btn h-14 rounded-2xl bg-white border border-gray-200 text-xl font-bold text-gray-800 shadow-key flex items-center justify-center hover:bg-gray-50" data-key="0" type="button">
          0
        </button>
<!-- Submit / Confirm Key (Burgundy) -->
<button aria-label="Submit Answer" class="key-btn h-14 rounded-2xl bg-brand-burgundy text-white shadow-glow flex items-center justify-center hover:bg-brand-burgundyHover transition-colors" id="btn-submit" type="button">
<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</button>
</div>
</section>
<!-- END: NumericKeypad -->
<!-- BEGIN: iOSHomeIndicator -->
<footer class="pb-2 pt-0 flex justify-center w-full">
<div class="w-32 h-1 bg-gray-300 rounded-full"></div>
</footer>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileDeviceFrame -->
<!-- BEGIN: InteractiveScript -->
<script data-purpose="keypad-input-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const display = document.getElementById('display-value');
      const numKeys = document.querySelectorAll('[data-key]');
      const backspaceBtn = document.getElementById('btn-backspace');
      const submitBtn = document.getElementById('btn-submit');
      
      let currentValue = '';

      // Append number
      numKeys.forEach(btn => {
        btn.addEventListener('click', () => {
          if (currentValue.length < 8) {
            currentValue += btn.getAttribute('data-key');
            updateDisplay();
          }
        });
      });

      // Remove last digit
      backspaceBtn.addEventListener('click', () => {
        currentValue = currentValue.slice(0, -1);
        updateDisplay();
      });

      // Submit action simulation
      submitBtn.addEventListener('click', () => {
        if (currentValue.length > 0) {
          // Provide subtle visual confirmation
          display.parentElement.classList.add('ring-2', 'ring-brand-burgundy');
          setTimeout(() => {
            display.parentElement.classList.remove('ring-2', 'ring-brand-burgundy');
          }, 300);
        }
      });

      function updateDisplay() {
        display.textContent = currentValue;
      }
    });
  </script>
<!-- END: InteractiveScript -->
</body></html>
