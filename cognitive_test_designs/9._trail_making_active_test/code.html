<!DOCTYPE html>

<html lang="en"><head>

<!-- Google Fonts: Plus Jakarta Sans -->

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {

            brand: {

<!-- Custom Animations and Canvas Styles -->
<style data-purpose="canvas-and-effects">
    .dot-matrix {
      background-image: radial-gradient(#d1d5db 1px, transparent 1px);
      background-size: 22px 22px;
    }
    @keyframes pulse-ring {
      0% {

        box-shadow: 0 0 0 0 rgba(158, 42, 71, 0.4);
      }
      70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 10px rgba(158, 42, 71, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(158, 42, 71, 0);
      }
    }
    .pulse-active {
      animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 antialiased font-sans select-none">

<!-- BEGIN: TopStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-30 shrink-0 select-none">
<span class="text-xs font-bold text-slate-800 tracking-tight">9:41</span>
<!-- Sensor / Dynamic Island Notch Pill -->
<div class="w-24 h-4 bg-slate-900 rounded-full mx-auto -mt-1 opacity-90"></div>
<div class="flex items-center space-x-1.5 text-slate-800">

<rect height="18" rx="1" width="3" x="17" y="4"></rect>

<path d="M12 4a15.9 15.9 0 0 0-9.9 3.5.75.75 0 0 0 .04 1.15l9.33 8.35a.75.75 0 0 0 1.06 0l9.33-8.35a.75.75 0 0 0 .04-1.15A15.9 15.9 0 0 0 12 4Z"></path>

<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: TopStatusBar -->
<!-- BEGIN: NavigationAndHeaderControls -->
<section class="px-5 pt-3 pb-2 flex items-center justify-between z-20 shrink-0" data-purpose="test-nav-bar">

<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center Status Pill: 'Active Test' -->
<div class="flex items-center space-x-1.5 px-3 py-1 bg-white border border-slate-100/80 shadow-xs rounded-full">

<span class="text-[12px] font-bold text-slate-700 tracking-tight">Active Test</span>
</div>
<!-- Right Controls: Restart & Live Timer -->
<div class="flex items-center space-x-2">

<button class="flex items-center space-x-1 px-2.5 py-1 bg-white hover:bg-slate-50 border border-slate-200/70 shadow-xs rounded-full text-slate-500 text-[11px] font-semibold active:scale-95 transition" type="button">

</svg>
<span>Restart</span>
</button>
<!-- Digital Timer Pill -->
<div class="flex items-center space-x-1 px-2.5 py-1 bg-amber-50 border border-amber-200/60 rounded-full text-amber-700 text-[11px] font-bold tracking-tight">
<svg class="w-3 h-3 text-amber-600" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<polyline points="12 7 12 12 15 14"></polyline>
</svg>
<span>01:27</span>
</div>
</div>
</section>
<!-- END: NavigationAndHeaderControls -->
<!-- BEGIN: TitleAndInstructions -->
<section class="px-6 pt-2 pb-1 text-center shrink-0 z-10" data-purpose="instructions-header">
<h1 class="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">
        Connect the Dots
      </h1>
<p class="text-[11.5px] font-medium text-slate-500 mt-1 max-w-[280px] mx-auto leading-relaxed">
        Draw a line to connect the circles in order, alternating between numbers and letters: <span class="font-bold text-brand-500">1 – A – 2 – B – 3...</span>
</p>
</section>
<!-- END: TitleAndInstructions -->
<!-- BEGIN: TrailMakingField -->
<section class="relative flex-1 mx-3 my-2 bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden flex flex-col justify-center items-center" data-purpose="test-board">
<!-- Subtle Dot Matrix Background Grid -->
<div class="absolute inset-0 dot-matrix opacity-40 pointer-events-none"></div>
<!-- SVG Connection Lines Layer -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-0" fill="none" viewbox="0 0 366 540" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Active Gradient Stroke for Completed Path -->
<lineargradient id="completedTrail" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#9e2a47"></stop>
<stop offset="50%" stop-color="#be185d"></stop>
<stop offset="100%" stop-color="#0d9488"></stop>
</lineargradient>
<!-- Animated Progress Trail Line -->
<lineargradient id="inProgressTrail" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#0d9488"></stop>
<stop offset="100%" stop-color="#38bdf8"></stop>
</lineargradient>
</defs>
<!-- Confirmed Completed Paths: 1 -> A -> 2 -->
<!-- 1 (68, 140) to A (260, 95) -->
<line stroke="#9e2a47" stroke-linecap="round" stroke-width="3.5" x1="78" x2="260" y1="135" y2="100"></line>
<!-- A (260, 95) to 2 (115, 275) -->
<line stroke="#9e2a47" stroke-linecap="round" stroke-width="3.5" x1="260" x2="118" y1="100" y2="270"></line>
<!-- Dynamic In-Progress Path: 2 (115, 275) connecting towards B (270, 310) -->
<line class="opacity-80" stroke="url(#inProgressTrail)" stroke-dasharray="6 4" stroke-linecap="round" stroke-width="3" x1="118" x2="200" y1="270" y2="290"></line>
<!-- Live drawing user cursor indicator -->
<circle cx="200" cy="290" fill="#0d9488" r="4.5"></circle>
<circle cx="200" cy="290" opacity="0.35" r="10" stroke="#0d9488" stroke-width="1.5"></circle>
</svg>
<!-- Trail Nodes Layer (Scatter Layout for Part B: 1-A-2-B-3-C-4-D) -->
<div class="relative w-full h-full" data-purpose="node-matrix">
<!-- NODE 1 (Completed) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center" style="top: 115px; left: 56px;">
<div class="w-12 h-12 rounded-full bg-brand-50 border-2 border-brand-500 flex items-center justify-center text-brand-600 font-extrabold text-lg shadow-sm">
            1
          </div>

<span class="absolute -top-1 -right-1 w-4 h-4 bg-brand-500 rounded-full flex items-center justify-center shadow-xs">
<svg class="w-2.5 h-2.5 text-white" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</span>
</div>
<!-- NODE A (Completed) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center" style="top: 98px; left: 262px;">
<div class="w-12 h-12 rounded-full bg-brand-50 border-2 border-brand-500 flex items-center justify-center text-brand-600 font-extrabold text-lg shadow-sm">
            A
          </div>
<span class="absolute -top-1 -right-1 w-4 h-4 bg-brand-500 rounded-full flex items-center justify-center shadow-xs">
<svg class="w-2.5 h-2.5 text-white" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</span>
</div>
<!-- NODE 2 (Current Pivot Node - Active Pulse) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-10" style="top: 270px; left: 118px;">
<div class="w-13 h-13 rounded-full bg-teal-50 border-[2.5px] border-teal-600 flex items-center justify-center text-teal-700 font-black text-xl shadow-md pulse-active">
            2
          </div>
<span class="mt-1 text-[9px] font-bold text-teal-600 uppercase tracking-wider bg-teal-50/90 px-1.5 py-0.5 rounded">Connected</span>
</div>
<!-- NODE B (Target Next Node - Soft Glow Highlight) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center cursor-pointer transition hover:scale-105 active:scale-95" style="top: 310px; left: 272px;">
<div class="w-12 h-12 rounded-full bg-white border-2 border-dashed border-teal-400 flex items-center justify-center text-slate-800 font-bold text-lg shadow-sm hover:border-teal-500">
            B
          </div>
<span class="absolute -bottom-4 text-[9px] font-semibold text-teal-600 animate-bounce">Next</span>
</div>
<!-- NODE 3 (Upcoming) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-90" style="top: 440px; left: 95px;">
<div class="w-12 h-12 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center text-slate-700 font-bold text-lg shadow-xs">
            3
          </div>
</div>
<!-- NODE C (Upcoming) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-85" style="top: 445px; left: 240px;">
<div class="w-12 h-12 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center text-slate-700 font-bold text-lg shadow-xs">
            C
          </div>
</div>
<!-- NODE 4 (Upcoming) -->
<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center opacity-75" style="top: 180px; left: 195px;">
<div class="w-12 h-12 rounded-full bg-white border-2 border-slate-200 flex items-center justify-center text-slate-600 font-bold text-lg shadow-2xs">
            4
          </div>
</div>

<div class="w-12 h-12 rounded-full bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 font-bold text-lg shadow-2xs">
            D
          </div>
</div>
</div>
<!-- Floating User Hint Bar inside Canvas -->
<div class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-xs text-white text-[11px] font-medium px-4 py-1.5 rounded-full shadow-lg flex items-center space-x-2 pointer-events-none">
<span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-ping"></span>
<span>Drag from <b>2</b> to <b>B</b></span>
</div>
</section>
<!-- END: TrailMakingField -->
<!-- BEGIN: BottomAssistAndNavigation -->
<footer class="px-6 py-2 pb-3 shrink-0 flex flex-col items-center space-y-2 z-20">
<!-- Sequence Progress Tracker Bar -->
<div class="w-full bg-white border border-slate-100 rounded-xl px-3.5 py-2 flex items-center justify-between shadow-2xs">
<div class="flex items-center space-x-1 text-[11px] font-bold text-slate-500">

<span class="text-brand-500 line-through">1</span>
<span class="text-slate-300">→</span>
<span class="text-brand-500 line-through">A</span>
<span class="text-slate-300">→</span>
<span class="text-teal-600 font-extrabold underline">2</span>
<span class="text-slate-300">→</span>
<span class="text-slate-800 font-extrabold bg-slate-100 px-1 rounded">B</span>
<span class="text-slate-300">→</span>
<span class="text-slate-400">3</span>
</div>
<div class="text-[10px] font-extrabold text-teal-600 bg-teal-50 px-2 py-0.5 rounded-md">
          Part B
        </div>
</div>
<!-- iOS Home Indicator Gesture Bar -->
<div class="w-32 h-1 bg-slate-900/30 rounded-full mx-auto mt-1"></div>
</footer>
<!-- END: BottomAssistAndNavigation -->
</main>
